name: Sync Cards

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  check-new-sets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sync-needed: ${{ steps.check.outputs.sync-needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - id: check
        run: |
          if python3 scripts/check_sync_needed.py; then
            echo "sync-needed=true" >> $GITHUB_OUTPUT
          else
            echo "sync-needed=false" >> $GITHUB_OUTPUT
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  sync-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: check-new-sets
    if: needs.check-new-sets.outputs.sync-needed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/sync_cards.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
